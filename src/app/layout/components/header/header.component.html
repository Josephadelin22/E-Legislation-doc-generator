<header class="app-header">
  <div class="header-container">
    <!-- Marque & Identité régalienne -->
    <div class="brand-zone" (click)="resetToCatalogue()">
      <div class="republique-block">
        <span class="rep-text rep-top">RÉPUBLIQUE</span>
        <span class="rep-text rep-bottom">GABONAISE</span>
      </div>

      <div class="header-divider"></div>

      <div class="app-title-group">
        <i class="bi bi-bank app-icon"></i>
        <span class="app-title">E-Législation</span>
      </div>
    </div>

    <!-- Centre : Fonction de l'application -->
    <div class="header-center">
      <i class="bi bi-journal-text"></i>
      <span> Outils d'Aide à l'édition des textes de loi</span>
    </div>

    <!-- Actions & Profil -->
    <div class="header-actions">
      <div class="entity-pill">
        <i class="bi bi-building"></i>
        <span>Ministère</span>
      </div>

      <div class="avatar-badge" title="Secrétariat Général">
        <span>SG</span>
      </div>
    </div>
  </div>
</header>
